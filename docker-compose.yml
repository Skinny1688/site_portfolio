# SiteScan stack — isolated from other VPS projects
# Deploy only on stage 7. Local: docker compose up db

services:
  db:
    image: postgres:16-alpine
    container_name: sitescan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sitescan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sitescan_dev}
      POSTGRES_DB: sitescan
    volumes:
      - sitescan_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitescan -d sitescan"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: sitescan-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sitescan:${POSTGRES_PASSWORD:-sitescan_dev}@db:5432/sitescan
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_NOTIFY_CHAT_ID: ${TELEGRAM_NOTIFY_CHAT_ID:-}
      NODE_ENV: production
    ports:
      # 3001 занят lovepostera.online на этом VPS
      - "3002:3000"
    profiles:
      - full

volumes:
  sitescan_pgdata:
    name: sitescan_pgdata
